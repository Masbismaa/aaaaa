<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200">
  <style>
    .sans { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: Consolas, 'SFMono-Regular', Menlo, monospace; }

    @keyframes draw { from { stroke-dashoffset: 720; } to { stroke-dashoffset: 0; } }
    @keyframes pop { 0% { transform: scale(.6); opacity: 0; } 70% { transform: scale(1.06); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.35); } }
    @keyframes travel { 0% { transform: translateX(0); opacity: 0; } 8% { opacity: 1; } 92% { opacity: 1; } 100% { transform: translateX(720px); opacity: 0; } }

    .line { stroke-dasharray: 720; animation: draw 2.4s ease-in-out both; }
    .step { transform-box: fill-box; transform-origin: center; opacity: 0; animation: pop .55s cubic-bezier(.34,1.56,.64,1) forwards; }
    .s1 { animation-delay: .1s; } .s2 { animation-delay: .6s; } .s3 { animation-delay: 1.1s; } .s4 { animation-delay: 1.6s; } .s5 { animation-delay: 2.1s; }
    .dot { animation: travel 4s ease-in-out 2.6s infinite; }
    .ping { transform-box: fill-box; transform-origin: center; animation: pulse 1.6s ease-in-out infinite; }
  </style>

  <rect width="900" height="200" fill="#FFF8E7"/>

  <line x1="90" y1="78" x2="810" y2="78" stroke="#111" stroke-width="5" class="line"/>
  <circle cx="90" cy="78" r="7" fill="#FF6B6B" stroke="#111" stroke-width="3" class="dot"/>

  <g class="step s1">
    <rect x="46" y="40" width="88" height="76" rx="6" fill="#111"/>
    <rect x="40" y="34" width="88" height="76" rx="6" fill="#FFD23F" stroke="#111" stroke-width="4"/>
    <text x="84" y="84" text-anchor="middle" class="mono" font-size="28" font-weight="800" fill="#111">01</text>
    <text x="87" y="148" text-anchor="middle" class="sans" font-size="15" font-weight="800" fill="#111">Requirement</text>
    <text x="87" y="168" text-anchor="middle" class="mono" font-size="12" fill="#444">analisis spesifikasi</text>
  </g>

  <g class="step s2">
    <rect x="226" y="40" width="88" height="76" rx="6" fill="#111"/>
    <rect x="220" y="34" width="88" height="76" rx="6" fill="#fff" stroke="#111" stroke-width="4"/>
    <text x="264" y="84" text-anchor="middle" class="mono" font-size="28" font-weight="800" fill="#111">02</text>
    <text x="267" y="148" text-anchor="middle" class="sans" font-size="15" font-weight="800" fill="#111">Schema</text>
    <text x="267" y="168" text-anchor="middle" class="mono" font-size="12" fill="#444">model &amp; naming</text>
  </g>

  <g class="step s3">
    <rect x="406" y="40" width="88" height="76" rx="6" fill="#111"/>
    <rect x="400" y="34" width="88" height="76" rx="6" fill="#74B9FF" stroke="#111" stroke-width="4"/>
    <text x="444" y="84" text-anchor="middle" class="mono" font-size="28" font-weight="800" fill="#111">03</text>
    <text x="447" y="148" text-anchor="middle" class="sans" font-size="15" font-weight="800" fill="#111">Logika Bisnis</text>
    <text x="447" y="168" text-anchor="middle" class="mono" font-size="12" fill="#444">validasi &amp; RBAC</text>
  </g>

  <g class="step s4">
    <rect x="586" y="40" width="88" height="76" rx="6" fill="#111"/>
    <rect x="580" y="34" width="88" height="76" rx="6" fill="#fff" stroke="#111" stroke-width="4"/>
    <text x="624" y="84" text-anchor="middle" class="mono" font-size="28" font-weight="800" fill="#111">04</text>
    <text x="627" y="148" text-anchor="middle" class="sans" font-size="15" font-weight="800" fill="#111">Testing</text>
    <text x="627" y="168" text-anchor="middle" class="mono" font-size="12" fill="#444">pytest +/-</text>
  </g>

  <g class="step s5">
    <rect x="766" y="40" width="88" height="76" rx="6" fill="#111"/>
    <rect x="760" y="34" width="88" height="76" rx="6" fill="#FF6B6B" stroke="#111" stroke-width="4"/>
    <text x="804" y="84" text-anchor="middle" class="mono" font-size="28" font-weight="800" fill="#111">05</text>
    <text x="807" y="148" text-anchor="middle" class="sans" font-size="15" font-weight="800" fill="#111">Commit</text>
    <text x="807" y="168" text-anchor="middle" class="mono" font-size="12" fill="#444">conventional</text>
    <circle cx="842" cy="40" r="7" fill="#111" class="ping"/>
  </g>
</svg>
