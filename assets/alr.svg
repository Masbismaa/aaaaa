<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340">
  <style>
    .sans { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: Consolas, 'SFMono-Regular', Menlo, monospace; }

    @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes status { 0%, 100% { fill: #2ECC71; } 50% { fill: #A8F0C6; } }
    @keyframes scan { 0% { transform: translateY(0); opacity: 0; } 10% { opacity: .9; } 90% { opacity: .9; } 100% { transform: translateY(118px); opacity: 0; } }
    @keyframes type { from { transform: translateX(0); } to { transform: translateX(222px); } }
    @keyframes caret { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }

    .rise { opacity: 0; animation: rise .6s ease-out forwards; }
    .d1 { animation-delay: .2s; } .d2 { animation-delay: .4s; } .d3 { animation-delay: .6s; } .d4 { animation-delay: .8s; } .d5 { animation-delay: 1s; }
    .live { animation: status 1.8s ease-in-out infinite; }
    .scan { animation: scan 3.5s ease-in-out 1.2s infinite; }
    .reveal { animation: type 2.2s steps(26) 1s both; }
    .caret { animation: caret .9s step-end infinite; }
  </style>

  <rect width="900" height="340" fill="#FFF8E7"/>

  <rect x="26" y="26" width="856" height="296" rx="6" fill="#111"/>
  <rect x="16" y="16" width="856" height="296" rx="6" fill="#fff" stroke="#111" stroke-width="4"/>

  <rect x="16" y="16" width="856" height="46" rx="6" fill="#FFD23F" stroke="#111" stroke-width="4"/>
  <circle cx="44" cy="39" r="7" fill="#FF6B6B" stroke="#111" stroke-width="2.5"/>
  <circle cx="66" cy="39" r="7" fill="#fff" stroke="#111" stroke-width="2.5"/>
  <circle cx="88" cy="39" r="7" fill="#74B9FF" stroke="#111" stroke-width="2.5"/>
  <text x="444" y="45" text-anchor="middle" class="mono" font-size="15" font-weight="800" fill="#111">ALR // ACCESS LINK REGISTER</text>

  <g class="rise d1">
    <rect x="40" y="80" width="190" height="210" rx="4" fill="#111"/>
    <text x="58" y="112" class="mono" font-size="14" font-weight="800" fill="#FFD23F">MBP</text>
    <text x="58" y="148" class="sans" font-size="14" font-weight="700" fill="#fff">Dashboard</text>
    <text x="58" y="176" class="sans" font-size="14" fill="#bbb">Access Entry</text>
    <text x="58" y="204" class="sans" font-size="14" fill="#bbb">Workspace</text>
    <text x="58" y="232" class="sans" font-size="14" fill="#bbb">Audit Log</text>
    <rect x="50" y="134" width="4" height="20" fill="#FFD23F"/>
  </g>

  <g class="rise d2">
    <rect x="250" y="80" width="600" height="40" rx="4" fill="#FFF8E7" stroke="#111" stroke-width="3"/>
    <text x="266" y="105" class="mono" font-size="14" fill="#666">search:</text>
    <text x="330" y="105" class="mono" font-size="14" font-weight="700" fill="#111">network  category:general</text>
    <g class="reveal">
      <rect x="328" y="88" width="260" height="24" fill="#FFF8E7"/>
      <rect x="328" y="90" width="2" height="20" fill="#111" class="caret"/>
    </g>
    <rect x="740" y="86" width="100" height="28" rx="3" fill="#111"/>
    <text x="790" y="105" text-anchor="middle" class="mono" font-size="12" font-weight="800" fill="#FFD23F">EXPORT XLSX</text>
  </g>

  <g class="rise d3">
    <rect x="250" y="134" width="600" height="156" rx="4" fill="#fff" stroke="#111" stroke-width="3"/>
    <rect x="250" y="134" width="600" height="32" fill="#111"/>
    <text x="266" y="155" class="mono" font-size="12" font-weight="800" fill="#FFD23F">TITLE</text>
    <text x="440" y="155" class="mono" font-size="12" font-weight="800" fill="#FFD23F">CATEGORY</text>
    <text x="580" y="155" class="mono" font-size="12" font-weight="800" fill="#FFD23F">VISIBILITY</text>
    <text x="740" y="155" class="mono" font-size="12" font-weight="800" fill="#FFD23F">STATUS</text>

    <text x="266" y="192" class="sans" font-size="14" fill="#111">Portal HRIS</text>
    <rect x="440" y="178" width="60" height="20" rx="3" fill="#FFD23F" stroke="#111" stroke-width="2"/>
    <text x="470" y="193" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#111">WEB</text>
    <text x="580" y="192" class="mono" font-size="12" fill="#111">public</text>
    <circle cx="748" cy="188" r="6" class="live" stroke="#111" stroke-width="2"/>
    <text x="760" y="192" class="mono" font-size="12" fill="#111">active</text>

    <line x1="250" y1="208" x2="850" y2="208" stroke="#ddd" stroke-width="1.5"/>
    <text x="266" y="232" class="sans" font-size="14" fill="#111">Core Switch L3</text>
    <rect x="440" y="218" width="84" height="20" rx="3" fill="#74B9FF" stroke="#111" stroke-width="2"/>
    <text x="482" y="233" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#111">NETWORK</text>
    <text x="580" y="232" class="mono" font-size="12" fill="#111">private</text>
    <circle cx="748" cy="228" r="6" class="live" stroke="#111" stroke-width="2"/>
    <text x="760" y="232" class="mono" font-size="12" fill="#111">active</text>

    <line x1="250" y1="248" x2="850" y2="248" stroke="#ddd" stroke-width="1.5"/>
    <text x="266" y="272" class="sans" font-size="14" fill="#111">Legacy ERP</text>
    <rect x="440" y="258" width="44" height="20" rx="3" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="462" y="273" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#111">APP</text>
    <text x="580" y="272" class="mono" font-size="12" fill="#111">public</text>
    <circle cx="748" cy="268" r="6" fill="#FF6B6B" stroke="#111" stroke-width="2"/>
    <text x="760" y="272" class="mono" font-size="12" fill="#111">down</text>

    <rect x="252" y="168" width="596" height="3" fill="#FFD23F" class="scan"/>
  </g>
</svg>
