<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330">
  <style>
    .mono { font-family: Consolas, 'SFMono-Regular', Menlo, monospace; }
    @keyframes cycle { 0% { opacity: 0; } 3% { opacity: 1; } 93% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes grow { 0%, 46% { transform: scaleX(0); } 60%, 100% { transform: scaleX(1); } }
    @keyframes blink { 50% { opacity: 0; } }
    .loop { animation: cycle 10s linear infinite; }
    .fill { transform-box: fill-box; transform-origin: left; animation: grow 10s ease-out infinite; }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes k0 { 0%, 6% { opacity: 0; transform: translateX(-8px); } 8%, 100% { opacity: 1; transform: none; } }
    .l0 { animation: k0 10s ease-out infinite; }
    @keyframes k1 { 0%, 11% { opacity: 0; transform: translateX(-8px); } 13%, 100% { opacity: 1; transform: none; } }
    .l1 { animation: k1 10s ease-out infinite; }
    @keyframes k2 { 0%, 16% { opacity: 0; transform: translateX(-8px); } 18%, 100% { opacity: 1; transform: none; } }
    .l2 { animation: k2 10s ease-out infinite; }
    @keyframes k3 { 0%, 21% { opacity: 0; transform: translateX(-8px); } 23%, 100% { opacity: 1; transform: none; } }
    .l3 { animation: k3 10s ease-out infinite; }
    @keyframes k4 { 0%, 26% { opacity: 0; transform: translateX(-8px); } 28%, 100% { opacity: 1; transform: none; } }
    .l4 { animation: k4 10s ease-out infinite; }
    @keyframes k5 { 0%, 31% { opacity: 0; transform: translateX(-8px); } 33%, 100% { opacity: 1; transform: none; } }
    .l5 { animation: k5 10s ease-out infinite; }
    @keyframes k6 { 0%, 36% { opacity: 0; transform: translateX(-8px); } 38%, 100% { opacity: 1; transform: none; } }
    .l6 { animation: k6 10s ease-out infinite; }
    @keyframes k7 { 0%, 44% { opacity: 0; transform: translateX(-8px); } 46%, 100% { opacity: 1; transform: none; } }
    .l7 { animation: k7 10s ease-out infinite; }
  </style>

